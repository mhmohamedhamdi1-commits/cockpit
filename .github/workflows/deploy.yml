# Déploiement : main -> environnement DEV, release -> PRODUCTION (après tests).
# Secrets GitHub nécessaires : SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, CRON_SECRET, BACKUP_KEY, DEV_REF.
name: Déploiement
on:
  push: { branches: [main, release] }
  workflow_dispatch:
concurrency: { group: deploy-${{ github.ref_name }}, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release' && 'production' || 'development' }}
    env:
      COCKPIT_ENV: ${{ github.ref_name == 'release' && 'prod' || 'dev' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      DEV_REF: ${{ secrets.DEV_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test tests/db.test.mjs tests/core.test.mjs
      - run: node tools/cloud/deploy.mjs supabase --force
      - run: node tools/cloud/deploy.mjs app --force
