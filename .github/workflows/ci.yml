# Tests automatiques à chaque envoi sur main / release et à chaque pull request
name: Tests
on:
  push: { branches: [main, release] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test tests/db.test.mjs tests/core.test.mjs tests/xlsx.test.mjs
      - name: Contrôle de syntaxe
        run: for f in app/js/*.js app/js/views/*.js tools/cloud/*.mjs; do node --check "$f"; done
